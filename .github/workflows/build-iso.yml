name: Build Lareon OS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (leave empty to use the VERSION file)"
        required: false
  push:
    tags: ["v*"]
  pull_request:

jobs:
  # Fast check on every change: builds the Lareon packages and lints scripts.
  packages:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-pil python3-numpy python3-yaml dpkg-dev shellcheck lintian cmake g++ qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-qpa-plugins qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript fonts-noto-color-emoji grub-common >/dev/null
      - name: Lint shell scripts
        run: shellcheck -S warning build.sh tools/*.sh live/auto/* live/config/hooks/normal/*.hook.chroot packages/*/DEBIAN/post* packages/*/DEBIAN/pre*
      - name: Test the time-of-day logic
        run: python3 tests/test_timeofday.py
      - name: Build packages
        run: ./build.sh --packages-only
      - name: Screenshots of the Lareon screens (download the "screenshots" artifact)
        run: |
          for d in out/*.deb; do dpkg -x "$d" /; done
          fc-cache -f >/dev/null
          mkdir -p shots
          for p in wifi you lareon look privacy done; do
            QT_QPA_PLATFORM=offscreen /usr/bin/lareon-ui setup --page $p --screenshot shots/setup-$p.png
          done
          QT_QPA_PLATFORM=offscreen /usr/bin/lareon-ui install-failed --screenshot shots/install-failed.png
          # The Lareon installer screens: any QML error stops the build, because
          # a broken installer would only show up when someone tries to install.
          for p in language keyboard drive install done failed; do
            QT_QPA_PLATFORM=offscreen /usr/bin/lareon-ui install --page $p --screenshot shots/install-$p.png 2> shots/err-$p.txt || { cat shots/err-$p.txt; exit 1; }
            cat shots/err-$p.txt
            if grep -E "ReferenceError|TypeError|is not a type|Cannot assign|Unable to assign|unavailable|SyntaxError|is not installed" shots/err-$p.txt; then
              echo "QML problem on installer page $p"; exit 1
            fi
          done
          # Lareon Home (launcher) and Updates: same rule, any QML error stops the build
          for m in home updates; do
            QT_QPA_PLATFORM=offscreen /usr/bin/lareon-ui $m --screenshot shots/$m.png 2> shots/err-$m.txt || { cat shots/err-$m.txt; exit 1; }
            cat shots/err-$m.txt
            if grep -E "ReferenceError|TypeError|is not a type|Cannot assign|Unable to assign|unavailable|SyntaxError|is not installed" shots/err-$m.txt; then
              echo "QML problem on the $m screen"; exit 1
            fi
          done
          python3 -m py_compile packages/lareon-live/usr/lib/lareon/lareon-install packages/lareon-ui/usr/lib/lareon/lareon-apps packages/lareon-ui/usr/lib/lareon/lareon-update-check packages/lareon-ui/usr/lib/lareon/lareon-update-install packages/lareon-branding/usr/lib/lareon/recolor-icons packages/lareon-branding/usr/lib/lareon/rename-apps
          QT_QPA_PLATFORM=offscreen /usr/bin/lareon-ui crash --set name=Files --screenshot shots/crash.png
          for f in packages/lareon-branding/usr/share/sddm/themes/lareon/Main.qml packages/lareon-live/etc/calamares/branding/lareon/*.qml packages/lareon-branding/usr/share/plasma/look-and-feel/*/contents/*/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$f" >/dev/null || { echo "QML syntax error in $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
      - name: Check packages
        run: |
          for d in out/*.deb; do dpkg-deb --info "$d" >/dev/null; lintian --no-tag-display-limit "$d" || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: lareon-packages
          path: out/*.deb

  # Linux builds of the Lareon app and Ember, made from their source so the ISO
  # always has them (their releases only carry AppImages).
  apps:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the .deb packages
        env:
          TOKEN: ${{ secrets.LAREON_RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app-debs
          build() {  # repo, executable name
            repo="$1"; exe="$2"; dir="src-$(basename "$repo")"
            git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${repo}.git" "$dir" || { echo "::warning::could not get $repo"; return 0; }
            ( cd "$dir"
              npm install --no-audit --no-fund
              npx electron-builder --linux deb --x64 --publish never \
                -c.linux.target=deb \
                -c.linux.executableName="$exe" \
                -c.linux.maintainer="Lareon <help@lareon.org>" \
                -c.linux.artifactName='${name}_${version}_amd64.${ext}'
              cp dist/*.deb ../app-debs/ ) || echo "::warning::could not build $repo"
          }
          build lareon-admin-off/lareon-desktop lareon
          build lareon-admin-off/ember ember
          ls -la app-debs
      - name: Check the packages install on Debian 13
        run: |
          # An app package that fails to install would stop the whole ISO build,
          # so each one is test-installed here first. If it fails as built it is
          # retried without its install scripts; if it still fails it is left
          # out (the ISO then falls back to the release build or Firefox).
          shopt -s nullglob
          for deb in app-debs/*.deb; do
            echo "=== testing $deb"
            ok=false
            for attempt in as-built no-scripts; do
              if [ "$attempt" = no-scripts ]; then
                echo "--- retrying without install scripts"
                d="$(mktemp -d)"
                dpkg-deb -R "$deb" "$d"
                rm -f "$d"/DEBIAN/preinst "$d"/DEBIAN/postinst "$d"/DEBIAN/prerm "$d"/DEBIAN/postrm
                printf '#!/bin/sh\nchmod 4755 /opt/*/chrome-sandbox 2>/dev/null || true\nexit 0\n' > "$d/DEBIAN/postinst"
                chmod 755 "$d/DEBIAN/postinst"
                dpkg-deb --root-owner-group -Zxz -b "$d" "$deb.fixed" && mv "$deb.fixed" "$deb"
              fi
              if docker run --rm -v "$PWD/app-debs:/d" debian:trixie bash -c \
                   "apt-get update -qq && apt-get install -y --no-install-recommends /d/$(basename "$deb")"; then
                ok=true; break
              fi
            done
            $ok || { echo "::warning::$deb does not install on Debian 13; leaving it out"; rm -f "$deb"; }
          done
          ls -la app-debs
      - uses: actions/upload-artifact@v4
        with:
          name: app-debs
          path: app-debs/*.deb
          if-no-files-found: warn

  # Full ISO: only when you ask for it (Actions tab -> Run workflow) or push a v* tag.
  iso:
    needs: [packages, apps]
    if: ${{ !cancelled() && needs.packages.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Get the Lareon app and Ember builds
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: app-debs
          path: app-debs

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Build ISO in a Debian 13 container
        env:
          VERSION: ${{ inputs.version || '' }}
          LAREON_RELEASES_TOKEN: ${{ secrets.LAREON_RELEASES_TOKEN }}
        run: |
          V="${VERSION:-$(cat VERSION)}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then V="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          docker run --rm --privileged \
            -v "$PWD:/src" -w /src \
            -e VERSION="$V" -e LAREON_RELEASES_TOKEN \
            debian:trixie bash -euxc '
              sed -i "s/^Components:.*/Components: main contrib non-free-firmware/" /etc/apt/sources.list.d/debian.sources
              apt-get update -qq
              apt-get install -y -qq live-build python3 python3-pil python3-numpy curl ca-certificates \
                dpkg-dev xz-utils squashfs-tools xorriso grub-efi-amd64-bin grub-pc-bin mtools \
                dosfstools syslinux syslinux-common isolinux grub-common cmake g++ qt6-base-dev qt6-declarative-dev >/dev/null
              ./build.sh
            '
          sudo chown -R "$(id -u):$(id -g)" out
          ls -la out

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: lareon-os-${{ env.VERSION }}-amd64
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.VERSION }}
          path: |
            out/*.log
            work/live/build.log
          retention-days: 14
