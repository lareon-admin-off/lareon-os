# Lareon OS boot menu.
GRUB_DISTRIBUTOR="Lareon OS"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
# Lareon theme (fonts are loaded from the theme folder by grub-mkconfig)
GRUB_THEME=/usr/share/grub/themes/lareon/theme.txt
GRUB_GFXMODE=auto
# Normally hidden: press Esc while starting to see it. It also opens by itself
# after a start that didn't finish, when "Recovery options" was chosen, or when
# another operating system is installed (see /etc/grub.d/05_lareon).
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=1
# Lareon adds its own clearly named recovery entries (11_lareon_recovery).
GRUB_DISABLE_RECOVERY=true
# Find Windows and other systems for "Install next to Windows".
GRUB_DISABLE_OS_PROBER=false
