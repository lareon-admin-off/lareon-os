<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Lareon OS: Geist for interface text and Geist Mono for code, everywhere
     (including GTK, Flatpak and browser apps). Scripts Geist doesn't cover,
     like Arabic, Devanagari, Chinese, Japanese and Korean, fall back to Noto. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Geist</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>Geist</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Geist Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- Geist has no Arabic, Devanagari or CJK. Name the Noto fonts made for each
       script right after it, so those scripts never fall back to a plain default. -->
  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>Geist</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Arabic UI</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Arabic</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Devanagari</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK SC</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans</string></edit>
  </match>

  <!-- smooth, light hinting: soft modern letterforms instead of pixel-snapped ones -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
