# Lareon step at the end of installing: carry the chosen language over and
# make the first start open Lareon setup (full screen, before any desktop).
dontChroot: true
timeout: 300
script:
    - "mkdir -p ${ROOT}/var/lib/lareon"
    - "-cp /tmp/lareon-language ${ROOT}/var/lib/lareon/language"
    - "chroot ${ROOT} /usr/lib/lareon/prepare-first-start"
    - "-chroot ${ROOT} dpkg --purge lareon-live"
