# Lareon installer: keyboard page (QML from the Lareon branding folder).
# On Wayland the layout is set through locale1, which KWin follows because the
# installer session starts it with --locale1. That matters: the disk password
# is typed on this layout, and the same layout is used to unlock at start-up.
qmlSearch: both
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
guessLayout: true
