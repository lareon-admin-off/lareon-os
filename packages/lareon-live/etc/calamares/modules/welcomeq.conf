# Lareon installer: language page (QML from the Lareon branding folder)
qmlSearch: both
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false
requirements:
    requiredStorage: 15
    requiredRam: 2.0
    # No internet check: it would contact a web site, and installing works offline.
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - storage
        - ram
        - root
# Never look up the person's location to guess a language.
geoip:
    style: "none"
